[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ext2py"
dynamic = ["version"]
description = "Pure-Python, read-only ext2/ext3/ext4 filesystem reader and browsing shell, no root or kernel drivers needed"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Santiago Ciciliani" }]
keywords = [
  "ext2", "ext3", "ext4", "filesystem", "disk-image", "shell", "forensics", "linux", "macos", "read-only",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Filesystems",
  "Topic :: System :: Recovery Tools",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[project.scripts]
ext2py = "ext2py.cli:main"

[project.urls]
Homepage = "https://github.com/sciciliani/ext2py"
Repository = "https://github.com/sciciliani/ext2py"
Issues = "https://github.com/sciciliani/ext2py/issues"
Changelog = "https://github.com/sciciliani/ext2py/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "ext2py.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ext2py = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
